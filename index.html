<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>unwaiting</title>
  <meta name="description" content="Pripravujeme novú webovú stránku.">
  <style>
    :root {
      --bg: #f6f3ee;
      --text: #1f1d1a;
      --muted: #6b665e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514;
        --text: #f1ede6;
        --muted: #a39d93;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    p {
      margin-top: 12px;
      font-size: 1.125rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>unwaiting</h1>
    <p>Pripravujeme novú stránku.</p>
  </main>
</body>
</html>
